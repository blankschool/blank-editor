<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Blank Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=Caveat:wght@400;700&family=Lora:wght@400;700&family=Oswald:wght@400;600&family=DM+Serif+Display&display=swap">
</head>
<body>
<div id="view-login" style="display:none; height:100%"></div>
<div id="view-console" style="display:none; height:100%"></div>
<div id="view-editor" style="display:none; height:100%">
<div class="app">
  <div class="body">
    <nav class="rail" id="rail"></nav>
    <aside class="panel" id="panel" hidden></aside>

    <main class="stage" id="stage">
      <div class="world" id="world">
        <div class="pagebox" id="pagebox"></div>
        <div class="ovl" id="ovl"></div>
      </div>
      <div class="toolbelt" id="toolbelt" role="toolbar" aria-label="Ferramentas"></div>
      <div class="flyout" id="flyout" hidden></div>
    </main>

    <aside class="propspanel">
      <div class="propshead">
        <div class="headrow" style="margin-bottom: 6px">
          <button class="tbtn ghost iconbtn" id="backToConsole" title="Voltar para o console" aria-label="Voltar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <input class="docname" id="docname" value="Design sem título" aria-label="Nome do design" style="margin-bottom: 0">
        </div>
        <div class="headrow">
          <div class="zoomctl">
            <button id="zoomout" title="Reduzir zoom (⌘−)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <span class="zoomval num" id="zoomval">100%</span>
            <button id="zoomin" title="Ampliar zoom (⌘+)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <button id="zoomfit" title="Ajustar à tela (⌘0)" class="fitbtn">Ajustar</button>
            <div class="spacer"></div>
          </div>
        </div>
        <div class="headrow" style="margin-top: 6px">
          <button class="tbtn ghost iconbtn" id="importBtn" title="Abrir um arquivo .json" aria-label="Abrir">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17z"/></svg>
          </button>
          <button class="tbtn primary" id="exportBtn" style="flex: 1">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 20h14"/></svg>
            Exportar
          </button>
        </div>
      </div>
      <div class="props" id="props"></div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <h3 id="expTitle">Exportar</h3>
    <div class="grid4" id="fmts" style="margin-bottom:14px"></div>
    <div class="sec" style="margin-bottom:14px">
      <h4>Escala</h4>
      <div class="seg" id="scales"></div>
    </div>
    <div class="row">
      <button class="tbtn ghost" id="expCancel" style="flex:1">Cancelar</button>
      <button class="tbtn primary" id="expGo" style="flex:1">Exportar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
