# Config do nginx que serve o frontend em produção (blank-editor.ickanz.easypanel.host).
#
# Viveu fora do repositório, solta em /opt/blank-editor-frontend/ no VPS, até 2026-09-10 — e a
# cópia em disco lá tinha ficado para trás da que rodava no container: apontava para um upstream
# `blank-editor-api` que não existe mais desde a migração para o serviço do EasyPanel. O deploy
# seguinte buildou a partir dela e o site ficou fora do ar até a config ser recuperada de dentro
# da imagem antiga. É por isso que ela mora aqui agora.
#
# `try_files $uri /index.html` faz QUALQUER caminho inexistente responder 200 com o HTML da SPA —
# inclusive um asset que não subiu. Conferir deploy por status HTTP engana; olhe o content-type.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  location /api/ {
    proxy_read_timeout 300s;
    proxy_pass http://sites_blank-editor-api-v2:80;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://sites_blank-editor-api-v2:80;
    proxy_set_header Host $host;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
