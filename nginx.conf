server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Alinhado ao teto do backend e do pdf-import-service (500MB cada).
  client_max_body_size 500m;
  client_body_timeout 300s;

  # Backend agora é externo (Railway + Supabase Cloud), não mais um serviço docker interno.
  # resolver + variável em proxy_pass: nginx precisa resolver o hostname em runtime (DNS pode
  # mudar), não só na inicialização — sem isso, se o IP do Railway mudar, o nginx trava
  # servindo pro endereço antigo até reiniciar.
  resolver 1.1.1.1 8.8.8.8 valid=60s;
  set $backend_upstream "blank-editor-server-production.up.railway.app";

  location /api/ {
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass https://$backend_upstream;
    proxy_set_header Host $backend_upstream;
    proxy_ssl_server_name on;
  }

  location /health {
    proxy_pass https://$backend_upstream;
    proxy_set_header Host $backend_upstream;
    proxy_ssl_server_name on;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
